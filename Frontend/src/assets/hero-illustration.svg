<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circles -->
    <circle cx="250" cy="250" r="200" fill="#F5F3FF" opacity="0.5"/>
    <circle cx="250" cy="250" r="150" fill="#DDD6FE" opacity="0.3"/>
    
    <!-- Profile cards -->
    <g transform="translate(150, 100)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="200" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <circle cx="30" cy="25" r="15" fill="#6A38C2"/>
        <rect x="60" y="20" width="100" height="10" rx="2" fill="#4B5563"/>
        <rect x="60" y="40" width="80" height="8" rx="2" fill="#9CA3AF"/>
        
        <!-- Card 2 -->
        <rect x="50" y="100" width="200" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <circle cx="80" cy="125" r="15" fill="#6A38C2"/>
        <rect x="110" y="120" width="100" height="10" rx="2" fill="#4B5563"/>
        <rect x="110" y="140" width="80" height="8" rx="2" fill="#9CA3AF"/>
        
        <!-- Card 3 -->
        <rect x="-30" y="200" width="200" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
        <circle cx="0" cy="225" r="15" fill="#6A38C2"/>
        <rect x="30" y="220" width="100" height="10" rx="2" fill="#4B5563"/>
        <rect x="30" y="240" width="80" height="8" rx="2" fill="#9CA3AF"/>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="100" cy="150" r="5" fill="#6A38C2"/>
    <circle cx="400" cy="350" r="5" fill="#6A38C2"/>
    <circle cx="150" cy="400" r="3" fill="#6A38C2"/>
    <circle cx="350" cy="100" r="3" fill="#6A38C2"/>
</svg> 